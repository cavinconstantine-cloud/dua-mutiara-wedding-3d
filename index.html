<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>Dua Mutiara Wedding 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D room; quiet title top-left; a rail of viewpoints along the bottom; walk pad bottom-right. */
:root{
  --ink:#0d0a09; --panel:rgba(22,16,14,.8); --line:rgba(239,230,216,.36);
  --cream:#efe6d8; --muted:#d3c5ae; --bloom:#8e1f33; --olive:#6b6535;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--ui);overflow:hidden}
#stage{position:fixed;inset:0;background:var(--ink)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%)}
.head{position:fixed;left:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0;pointer-events:none;display:flex;flex-direction:column;gap:4px;max-width:min(92vw,560px)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-shadow:0 1px 8px rgba(0,0,0,.8)}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4.2vw,40px);line-height:1.05;text-wrap:balance;text-shadow:0 2px 16px rgba(0,0,0,.75)}
.hint{font-size:12px;font-weight:600;color:var(--muted);text-shadow:0 1px 8px rgba(0,0,0,.85)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px;pointer-events:none}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.rail{display:flex;gap:8px;overflow-x:auto;pointer-events:auto;padding-bottom:2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
button{font-family:var(--ui);font-size:14px;font-weight:600;color:var(--cream);background:var(--panel);border:1px solid var(--line);border-radius:22px;min-height:44px;padding:0 16px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
label.pick{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:22px;min-height:44px;padding:0 6px 0 14px}
label.pick select{font-family:var(--ui);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--cream);background:transparent;border:0;min-height:42px;padding:0 6px;cursor:pointer}
label.pick select option{color:#1a1412;background:#efe6d8}
label.pick select:focus-visible{outline:2px solid var(--cream);outline-offset:2px;border-radius:16px}
button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
button[aria-pressed="true"]{background:var(--cream);color:#1a1412;border-color:var(--cream)}
.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:6px;pointer-events:auto;flex:none}
.pad button{padding:0;min-height:0;width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.pad .up{grid-column:2;grid-row:1}.pad .lf{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .rt{grid-column:3;grid-row:2}
.fail{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:16px;line-height:1.5;background:var(--ink)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div id="stage" role="img" aria-label="Ruang 3D Dua Mutiara Ballroom dengan dekorasi wedding: pelaminan, dance floor, meja tamu, catwalk dan foyer"></div>
<div class="head">
  <div class="eyebrow">JW MARRIOTT JAKARTA · DUA MUTIARA BALLROOM 45 × 20 × 7 M</div>
  <h1 id="viewName">Denah 3D</h1>
  <div class="hint" id="hint">Geser untuk memutar · cubit atau scroll untuk zoom</div>
</div>
<div class="dock">
  <div class="row">
    <div class="tools">
      <label class="pick" for="selTheme">Dekor
        <select id="selTheme">
          <option value="0">Olive &amp; burgundy</option>
          <option value="1">Drapery champagne</option>
          <option value="2">Ivory garden</option>
          <option value="3">Sasa's reference</option>
          <option value="4">Burgundy gazebo</option>
        </select>
      </label>
      <button type="button" id="btnBright" aria-pressed="true">Lampu terang</button>
      <button type="button" id="btnEntry" aria-pressed="false">Lampu entry</button>
      <button type="button" id="btnLabels" aria-pressed="true">Nomor meja</button>
      <button type="button" id="btnTour" aria-pressed="false">Tur otomatis</button>
      <button type="button" id="btnMusic" aria-pressed="false">Musik</button>
    </div>
    <div class="pad" aria-label="Kontrol gerak">
      <button type="button" class="up" data-k="f" aria-label="Maju"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 10 6.5l6 6"></path></svg></button>
      <button type="button" class="lf" data-k="l" aria-label="Putar ke kiri"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"></path></svg></button>
      <button type="button" class="dn" data-k="b" aria-label="Mundur"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 10 13.5l6-6"></path></svg></button>
      <button type="button" class="rt" data-k="r" aria-label="Putar ke kanan"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"></path></svg></button>
    </div>
  </div>
  <div class="rail" id="rail" aria-label="Sudut pandang"></div>
</div>
<div class="fail" id="fail" hidden>Perangkat atau browser ini tidak bisa menampilkan 3D. Coba buka di Chrome atau Safari versi terbaru.</div>

  var mCeil = std(0x8f7f6c, 0.95), mBeam = std(0x4a3a2c, 0.9);

  var mGold = std(0xb08d57, 0.3, 0.9);
  var mCloth = std(CLOTH.getHex(), 0.88), mRunner = std(new T.Color('#6e1423').getHex(), 0.75);
  var mDrape = std(0x5a5c3a, 0.92, 0, { side: T.DoubleSide }), mBurg = std(0x6e1423, 0.78, 0, { side: T.DoubleSide });

  var shadeTex = canvasTex(8, 256, function(g, w, h){ var gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#4a2a0c'); gr.addColorStop(0.5, '#e89a48'); gr.addColorStop(1, '#ffdca4'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });

  var mChair = std(0x15120f, 0.42, 0.1), mCush = std(0xe9e1d0, 0.9), mCream = std(0xe6dbc6, 0.85, 0, { side: T.DoubleSide });
